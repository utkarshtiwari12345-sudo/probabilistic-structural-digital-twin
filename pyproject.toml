[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-structural-digital-twin"
version = "0.1.0"
description = "Sequential Bayesian tracking of structural deterioration under sparse sensing and model discrepancy."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Utkarsh Tiwari" },
]
keywords = [
  "Bayesian inference",
  "digital twin",
  "offshore wind",
  "structural dynamics",
  "structural health monitoring",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "PyYAML>=6.0,<7",
  "scipy>=1.14,<2",
  "tqdm>=4.66,<5",
]

[project.urls]
Homepage = "https://github.com/utkarshtiwari12345-sudo/probabilistic-structural-digital-twin"
Documentation = "https://github.com/utkarshtiwari12345-sudo/probabilistic-structural-digital-twin/tree/main/docs"
Issues = "https://github.com/utkarshtiwari12345-sudo/probabilistic-structural-digital-twin/issues"
Source = "https://github.com/utkarshtiwari12345-sudo/probabilistic-structural-digital-twin"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -ra --strict-config --strict-markers --basetemp=work/pytest"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
