stage21:
  research_question: >-
    Can a healthy-commissioned, discrepancy-aware Bayesian twin detect and
    track ordered OpenFAST stiffness loss sequentially, and which conclusions
    depend on unavailable matched-excitation information?
  upstream:
    observations_path: data/processed/stage19_openfast_deterioration.csv
    observations_sha256: 512bc4bc5a10beebdb1dc8176fb20c57359c9319eeb0efc295e12f36c22aad79
    transfer_spectra_path: data/processed/stage20_transfer_spectra.csv
    transfer_spectra_sha256: e72ea178126558fa83dfad4f78c7054ca6c30ccd4fd224c71cd5af9e5a72d91b
    calibration_path: results/metrics/stage20_twin_calibration.csv
    calibration_sha256: 8e602b870a7f6926fc0b9a98dce3ce5191f8541876e7f3bb07c2bde47394d5e5
    discrepancy_path: results/metrics/stage20_discrepancy_model.csv
    discrepancy_sha256: ca7794647b37808f8a9eacc7c62c4227f89a6306c1f2345d8f327dc5fe1e8982
    transfer_metrics_path: results/metrics/stage20_transfer_case_metrics.csv
    transfer_metrics_sha256: d01bc28fc70d26ddaebf0fe88d512e0987339e33aefe02bb5ae44d87b7d02d4d
    transfer_validation_path: results/metrics/stage20_transfer_validation.csv
    transfer_validation_sha256: 0ab2f33e84bc08764825c68d7eea46e498fc1b8255d339e104d562bd96cf1cd4
  pseudo_longitudinal_replay:
    limitation: >-
      Each trajectory stitches independently initialized static OpenFAST cases
      under the same environmental realization. It is not a continuous
      time-varying OpenFAST simulation and cannot validate transition physics.
    zone_order: [lower_monopile, middle_monopile, upper_monopile]
    loss_sequence: [0.0, 0.10, 0.20, 0.30]
    windows_per_state: 5
    window_duration_s: 10.0
    analysis_start_time_s: 10.0
    minimum_frequency_hz: 0.10
    maximum_frequency_hz: 2.00
    channels:
      - nacelle_imu_fore_aft_acceleration_m_per_s2
      - nacelle_imu_side_side_acceleration_m_per_s2
  observation_regimes:
    commissioning_reference:
      interpretation: >-
        Each monitoring spectrum is divided by the pooled healthy commissioning
        spectrum. This is the operationally plausible but excitation-confounded
        regime.
    paired_excitation_oracle:
      interpretation: >-
        Each damaged window is divided by the matching healthy window from the
        identical wind and wave realization. This non-deployable oracle isolates
        structural-response change and is only an upper-bound benchmark.
  state_library:
    reduced_zone_names: [lower, middle, upper]
    openfast_zone_names: [lower_monopile, middle_monopile, upper_monopile]
    loss_levels: [0.10, 0.20, 0.30]
    meaningful_loss_fraction: 0.05
    credible_level: 0.95
  transition_model:
    initial_healthy_probability: 1.0
    healthy_persistence_probability: 0.995
    damage_progression_probability: 0.010
    zone_switch_probability: 0.005
  likelihood:
    family: diagonal_student_t
    degrees_of_freedom: 4.0
    likelihood_power: 0.25
    minimum_operational_log_variance: 0.25
    differential_model_discrepancy_standard_deviation: 0.35
    discrepancy_provenance: >-
      The 0.35 log-unit scale is the rounded maximum Stage 20 damaged-holdout
      differential RMSE (0.3491). Reusing those cases means Stage 21 is a
      transfer demonstration, not an independent external validation.
  alarm:
    probability_threshold: 0.80
    persistence_windows: 2
  expected_dimensions:
    state_count: 10
    trajectory_count: 3
    windows_per_trajectory: 20
    regime_count: 2
    frequency_count: 20
  hypotheses:
    maximum_operational_commissioning_false_alarm_fraction: 0.05
    maximum_oracle_commissioning_false_alarm_fraction: 0.05
    minimum_operational_damaged_detection_fraction: 0.50
    minimum_oracle_damaged_detection_fraction: 0.80
    maximum_operational_damaged_severity_mae: 0.15
    maximum_oracle_damaged_severity_mae: 0.10
    minimum_operational_severe_zone_selection_fraction: 0.67
    minimum_oracle_severe_zone_selection_fraction: 0.67
    minimum_operational_severity_interval_coverage: 0.80
    minimum_oracle_severity_interval_coverage: 0.80
    minimum_oracle_detection_fraction_improvement: 0.15
