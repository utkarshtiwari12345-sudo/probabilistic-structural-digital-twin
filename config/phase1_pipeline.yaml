pipeline:
  name: probabilistic_structural_digital_twin
  stages:
    - id: 1a
      name: structural_matrices
      command: scripts/verify_structural_matrices.py
      required_artifacts:
        - {path: config/base_model.yaml, minimum_size_bytes: 100}
    - id: 1b
      name: modal_analysis
      command: scripts/verify_modal_analysis.py
      required_artifacts:
        - {path: figures/stage1b_modal_properties.png, minimum_size_bytes: 1000}
    - id: 1c
      name: structural_dynamics
      command: scripts/verify_structural_dynamics.py
      required_artifacts:
        - {path: figures/stage1c_dynamic_verification.png, minimum_size_bytes: 1000}
    - id: 2
      name: deterioration_truth
      command: scripts/verify_deterioration_models.py
      required_artifacts:
        - {path: data/processed/stage2_deterioration_ground_truth.csv, minimum_size_bytes: 1000}
        - {path: figures/stage2_deterioration_scenarios.png, minimum_size_bytes: 1000}
    - id: 3
      name: sparse_monitoring
      command: scripts/verify_monitoring_system.py
      required_artifacts:
        - {path: data/processed/stage3_sparse_monitoring.csv, minimum_size_bytes: 1000}
        - {path: figures/stage3_sparse_monitoring.png, minimum_size_bytes: 1000}
    - id: 4
      name: identifiability
      command: scripts/run_identifiability_study.py
      required_artifacts:
        - {path: results/metrics/stage4_identifiability.csv, minimum_size_bytes: 100}
        - {path: figures/stage4_identifiability.png, minimum_size_bytes: 1000}
    - id: 5
      name: batch_recovery
      command: scripts/run_batch_recovery_study.py
      required_artifacts:
        - {path: results/metrics/stage5_recovery_summary.csv, minimum_size_bytes: 100}
        - {path: figures/stage5_batch_recovery.png, minimum_size_bytes: 1000}
    - id: 6
      name: sequential_tracking
      command: scripts/run_sequential_tracking_study.py
      required_artifacts:
        - {path: results/metrics/stage6_method_summary.csv, minimum_size_bytes: 100}
        - {path: results/metrics/stage6_alarm_calibration.csv, minimum_size_bytes: 100}
        - {path: figures/stage6_sequential_tracking.png, minimum_size_bytes: 1000}
    - id: 7
      name: nonlinear_filters
      command: scripts/run_nonlinear_filter_study.py
      required_artifacts:
        - {path: results/metrics/stage7_filter_summary.csv, minimum_size_bytes: 100}
        - {path: results/metrics/stage7_alarm_calibration.csv, minimum_size_bytes: 100}
        - {path: figures/stage7_filter_comparison.png, minimum_size_bytes: 1000}
    - id: 8
      name: model_discrepancy
      command: scripts/run_model_discrepancy_study.py
      required_artifacts:
        - {path: results/metrics/stage8_hypothesis_checks.csv, minimum_size_bytes: 100}
        - {path: figures/stage8_model_discrepancy.png, minimum_size_bytes: 1000}
    - id: 9
      name: joint_discrepancy
      command: scripts/run_joint_discrepancy_inference_study.py
      required_artifacts:
        - {path: results/metrics/stage9_hypothesis_checks.csv, minimum_size_bytes: 100}
        - {path: figures/stage9_joint_discrepancy_inference.png, minimum_size_bytes: 1000}
    - id: 10
      name: sensor_information
