window:
  duration_s: 60.0
  burn_in_s: 20.0
  time_step_s: 0.02

excitation:
  process: ornstein_uhlenbeck
  stationary_standard_deviation_n: 100000.0
  correlation_time_s: 0.75
  mean_n: 0.0
  # Relative force applied at DOFs 1 through 6. This is a transparent
  # wind-like lateral load profile, not a calibrated aerodynamic load model.
  spatial_distribution: [0.15, 0.30, 0.45, 0.60, 0.80, 1.00]

sensor_layouts:
  top_only:
    dofs_one_based: [6]
  two_spaced:
    dofs_one_based: [2, 6]
  three_spaced:
    dofs_one_based: [1, 3, 6]
  three_clustered:
    dofs_one_based: [4, 5, 6]
  full_reference:
    dofs_one_based: [1, 2, 3, 4, 5, 6]

noise:
  # Each value is sensor-noise standard deviation divided by the clean
  # acceleration standard deviation at that sensor.
  standard_deviation_fractions: [0.0, 0.02, 0.05, 0.10]

imperfect_case:
  layout: three_spaced
  noise_standard_deviation_fraction: 0.05
  constant_bias_fraction: 0.03
  end_of_window_drift_fraction: 0.05
  random_dropout_probability: 0.05
  contiguous_outages:
    # Sensor index is one-based within the selected layout.
    - sensor_one_based: 3
      start_s: 25.0
      end_s: 35.0

random_seeds:
  excitation: 20260831
  noise_base: 20260840
  imperfect_measurement: 20260850
  dropout: 20260860

verification:
  finite_window_statistical_z_limit: 3.0
  lag_one_correlation_tolerance: 0.03
  empirical_noise_relative_tolerance: 0.08
  minimum_available_fraction: 0.70
